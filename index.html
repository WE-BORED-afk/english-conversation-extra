<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แบบฝึก Conversation + Extra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8fafc;
      --bg-header: rgba(248, 250, 252, 0.94);
      --card: #ffffff;
      --border: #e2e8f0;
      --card-border: #f1f5f9;
      --fg: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-fg: #ffffff;
      --green: #10b981;
      --green-text: #047857;
      --green-bg: rgba(16, 185, 129, 0.12);
      --amber: #b45309;
      --amber-bg: rgba(245, 158, 11, 0.14);
      --extra-line: rgba(37, 99, 235, 0.45);
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-header: rgba(15, 23, 42, 0.94);
      --card: #1e293b;
      --border: #334155;
      --card-border: #273449;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-fg: #ffffff;
      --green: #10b981;
      --green-text: #34d399;
      --green-bg: rgba(16, 185, 129, 0.16);
      --amber: #fbbf24;
      --amber-bg: rgba(245, 158, 11, 0.16);
      --extra-line: rgba(59, 130, 246, 0.55);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg-header);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 0 12px;
      margin-bottom: 20px;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
    .subtitle { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tabs {
      display: inline-flex;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 9px;
      padding: 2px;
    }
    .tab-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active { background: var(--primary); color: var(--primary-fg); }
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
    }
    .theme-btn:hover { border-color: var(--primary); }
    .controls { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
    .search-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .search-input {
      flex: 1 1 220px;
      min-width: 200px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 12px; }
    .toggle-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .toggle-label input { width: 15px; height: 15px; accent-color: var(--primary); cursor: pointer; }
    .toggle-label input.ans-cb { accent-color: var(--green); }
    .count-badge { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
    .hidden { display: none !important; }
    .section-group { margin-bottom: 24px; }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .section-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .section-head span { font-size: 12px; color: var(--muted); }
    .cards-stack { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .card.highlight { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .card-title-row { display: flex; align-items: center; gap: 8px; }
    .q-num { font-size: 15px; font-weight: 700; }
    .page-tag {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 1px 8px;
      border-radius: 6px;
    }
    .set-tag { font-size: 12px; color: var(--muted); }
    .choices { display: flex; flex-direction: column; gap: 6px; }
    .choice-row { display: flex; align-items: flex-start; gap: 10px; padding: 3px 0; }
    .num-badge {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .num-badge.answer {
      border-radius: 9999px;
      border: 2px solid var(--green);
      background: var(--green-bg);
      color: var(--green-text);
      font-weight: 700;
    }
    .choice-body { flex: 1; min-width: 0; padding-top: 2px; }
    .choice-th { font-size: 14px; line-height: 1.55; }
    .choice-th.answer { font-weight: 600; }
    .extra-box {
      margin-top: 6px;
      padding-left: 10px;
      border-left: 2px solid var(--extra-line);
      font-size: 12px;
      line-height: 1.55;
    }
    .extra-label { font-weight: 700; color: var(--primary); }
    .extra-target { color: var(--muted); }
    .empty-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-val { font-size: 18px; font-weight: 700; margin-top: 2px; }
    .stat-val.green { color: var(--green-text); }
    .stat-val.amber { color: var(--amber); }
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .table-head { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .table-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
    .table-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    thead { background: var(--bg); color: var(--muted); }
    th, td { padding: 9px 12px; vertical-align: top; }
    tbody tr { border-top: 1px solid var(--border); }
    .jump-btn {
      border: 0;
      background: transparent;
      padding: 0;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      text-align: left;
    }
    .jump-btn:hover { text-decoration: underline; }
    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-pill.ok { background: var(--green-bg); color: var(--green-text); }
    .status-pill.warn { background: var(--amber-bg); color: var(--amber); }
    .syn-sub { color: var(--muted); margin-top: 3px; }
    .note-sub { color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="sticky-header">
      <div class="header-top">
        <div>
          <h1>แบบฝึก Conversation + Extra</h1>
          <p class="subtitle">6 ชุดข้อสอบ · 150 ข้อ (หน้า 1–38) · Extra 89 หน้า (91 รายการ · จับคู่ตัวเลือก 90 รายการ)</p>
        </div>
        <div class="header-actions">
          <div class="tabs">
            <button id="tab-exercises" type="button" class="tab-btn active">แบบฝึก (150 ข้อ)</button>
            <button id="tab-extra" type="button" class="tab-btn">ตาราง Extra (89 หน้า)</button>
          </div>
          <button id="theme-toggle" type="button" class="theme-btn" aria-label="สลับโหมดสี">โหมดมืด</button>
        </div>
      </div>

      <div id="exercise-controls" class="controls">
        <div id="set-filters" class="filters"></div>
        <div class="search-row">
          <input id="search-input" type="search" class="search-input" placeholder="ค้นหาข้อ, หน้า, คำแปลภาษาไทย, หรือวลี Extra..." />
          <div class="toggles">
            <label class="toggle-label">
              <input id="toggle-answers" type="checkbox" checked class="ans-cb" />
              <span>แสดงวงกลมสีเขียวเฉลย</span>
            </label>
            <label class="toggle-label">
              <input id="toggle-only-extra" type="checkbox" />
              <span>เฉพาะข้อที่มี Extra</span>
            </label>
            <span id="visible-count" class="count-badge">แสดง 150 / 150 ข้อ</span>
          </div>
        </div>
      </div>
    </header>

    <main id="view-exercises"></main>
    <section id="view-extra" class="hidden"></section>
  </div>

    const SETS = ['ทั้งหมด', 'TGAT 69', 'A-Level 69', 'TGAT 68', 'A-Level 68', 'TGAT 67', 'A-Level 67'];
    let activeSet = 'ทั้งหมด';
    let searchTerm = '';
    let showAnswers = true;
    let onlyExtra = false;

    const esc = (s) => String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const elExercises = document.getElementById('view-exercises');
    const elExtra = document.getElementById('view-extra');
    const elControls = document.getElementById('exercise-controls');
    const elFilters = document.getElementById('set-filters');
    const elSearch = document.getElementById('search-input');
    const elToggleAns = document.getElementById('toggle-answers');
    const elToggleOnlyExtra = document.getElementById('toggle-only-extra');
    const elVisibleCount = document.getElementById('visible-count');
    const btnTabEx = document.getElementById('tab-exercises');
    const btnTabExtra = document.getElementById('tab-extra');
    const btnTheme = document.getElementById('theme-toggle');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        btnTheme.textContent = 'โหมดสว่าง';
      } else {
        document.documentElement.removeAttribute('data-theme');
        btnTheme.textContent = 'โหมดมืด';
      }
      try { localStorage.setItem('extra_theme', theme); } catch (_) {}
    }

    (function initTheme() {
      let saved = 'light';
      try { saved = localStorage.getItem('extra_theme') || 'light'; } catch (_) {}
      applyTheme(saved);
    })();

    btnTheme.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });

    function setTab(tab) {
      if (tab === 'exercises') {
        elExercises.classList.remove('hidden');
        elControls.classList.remove('hidden');
        elExtra.classList.add('hidden');
        btnTabEx.classList.add('active');
        btnTabExtra.classList.remove('active');
      } else {
        elExercises.classList.add('hidden');
        elControls.classList.add('hidden');
        elExtra.classList.remove('hidden');
        btnTabExtra.classList.add('active');
        btnTabEx.classList.remove('active');
      }
    }

    function renderFilterPills() {
      elFilters.innerHTML = SETS.map((s) => {
        const cls = s === activeSet ? 'pill active' : 'pill';
        return `<button type="button" data-set="${esc(s)}" class="${cls}">${esc(s)}</button>`;
      }).join('');
      elFilters.querySelectorAll('button').forEach((b) => {
        b.addEventListener('click', () => {
          activeSet = b.getAttribute('data-set');
          renderFilterPills();
          renderExercises();
        });
      });
    }

    function matchesSearch(q, term) {
      if (!term) return true;
      const t = term.toLowerCase();
      if (`ข้อ ${q.q} หน้า ${q.p}`.toLowerCase().includes(t)) return true;
      if (`หน้า ${q.p} ข้อ ${q.q}`.toLowerCase().includes(t)) return true;
      if (q.s.toLowerCase().includes(t)) return true;
      if ((q.pt || '').toLowerCase().includes(t)) return true;
      if ((q.cv || '').toLowerCase().includes(t)) return true;
      for (const ch of q.c) {
        if (ch.t.toLowerCase().includes(t)) return true;
        for (const ei of ch.e) {
          const ex = EXTRAS[ei];
          if (`extra หน้า ${ex.kp}`.includes(t)) return true;
          if (ex.tp.toLowerCase().includes(t)) return true;
          if (ex.syn.some((syn) => syn.toLowerCase().includes(t))) return true;
        }
      }
      return false;
    }

    function renderExercises() {
      const filtered = QUESTIONS.filter((q) => {
        if (activeSet !== 'ทั้งหมด' && q.s !== activeSet) return false;
        if (onlyExtra && !q.c.some((ch) => ch.e.length > 0)) return false;
        if (!matchesSearch(q, searchTerm.trim())) return false;
        return true;
      });

      elVisibleCount.textContent = `แสดง ${filtered.length} / ${QUESTIONS.length} ข้อ`;

      if (filtered.length === 0) {
        elExercises.innerHTML = `<div class="empty-box">ไม่พบข้อที่ตรงกับเงื่อนไขที่ค้นหา</div>`;
        return;
      }

      let html = '';
      let lastGroup = '';
      for (const q of filtered) {
        const groupKey = [q.s, q.pt, q.cv].filter(Boolean).join(' · ');
        if (groupKey !== lastGroup) {
          if (lastGroup !== '') html += '</div></div>';
          lastGroup = groupKey;
          html += `
            <div class="section-group">
              <div class="section-head">
                <h2>${esc(q.s)}${q.pt ? ' — ' + esc(q.pt) : ''}</h2>
                ${q.cv ? `<span>${esc(q.cv)}</span>` : ''}
              </div>
              <div class="cards-stack">
          `;
        }

        const choicesHtml = q.c.map((ch) => {
          const isAns = showAnswers && ch.n === q.a;
          const badgeCls = isAns ? 'num-badge answer' : 'num-badge';
          const textCls = isAns ? 'choice-th answer' : 'choice-th';

          const extrasHtml = ch.e.map((ei) => {
            const ex = EXTRAS[ei];
            return `
              <div class="extra-box">
                <span class="extra-label">Extra หน้า ${ex.kp}</span>
                <span class="extra-target">(${esc(ex.tp)}):</span>
                <span>${esc(ex.syn.join(' / '))}</span>
              </div>
            `;
          }).join('');

          return `
            <div class="choice-row">
              <span class="${badgeCls}" aria-label="ตัวเลือก ${ch.n}${isAns ? ' เฉลย' : ''}">${ch.n}</span>
              <div class="choice-body">
                <div class="${textCls}">${esc(ch.t)}</div>
                ${extrasHtml}
              </div>
            </div>
          `;
        }).join('');

        html += `
          <article id="${esc(q.id)}" class="card">
            <div class="card-head">
              <div class="card-title-row">
                <span class="q-num">ข้อ ${q.q}</span>
                <span class="page-tag">หน้า ${q.p}</span>
              </div>
              <span class="set-tag">${esc(q.s)}</span>
            </div>
            <div class="choices">${choicesHtml}</div>
          </article>
        `;
      }
      if (lastGroup !== '') html += '</div></div>';
      elExercises.innerHTML = html;
    }

    function jumpToQuestion(qid) {
      if (!qid) return;
      activeSet = 'ทั้งหมด';
      onlyExtra = false;
      searchTerm = '';
      elSearch.value = '';
      elToggleOnlyExtra.checked = false;
      setTab('exercises');
      renderFilterPills();
      renderExercises();
      const target = document.getElementById(qid);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.classList.add('highlight');
        setTimeout(() => target.classList.remove('highlight'), 2000);
      }
    }

    function renderExtraView() {
      const nonExact = EXTRAS.filter((x) => x.st !== 'ตรงตามหน้า Extra');
      const matchedCount = EXTRAS.filter((x) => x.qid !== null).length;

      const summaryHtml = `
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">หน้าใน Extra</div>
            <div class="stat-val">89 หน้า (91 รายการ)</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">ต่อท้ายในตัวเลือก</div>
            <div class="stat-val green">${matchedCount} รายการ</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">หน้าอ่านไม่ออก</div>
            <div class="stat-val">0 หน้า</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">คลาดเคลื่อน / ไม่อยู่ในตัวเลือก</div>
            <div class="stat-val amber">${nonExact.length} รายการ</div>
          </div>
        </div>
      `;

      const notesRows = nonExact.map((r) => `
        <tr>
          <td style="font-weight:700; white-space:nowrap;">หน้า ${r.kp}</td>
          <td><code>${esc(r.tp)}</code></td>
          <td style="color:var(--muted);">${esc(r.cr)}</td>
          <td>
            <div>${r.qid ? `<button type="button" data-qid="${esc(r.qid)}" class="jump-btn">${esc(r.loc)}</button>` : esc(r.loc)}</div>
            <div class="note-sub">${esc(r.nt)}</div>
          </td>
          <td><span class="status-pill warn">${esc(r.st)}</span></td>
        </tr>
      `).join('');

      const allRows = EXTRAS.map((r) => {
        const isOk = r.st === 'ตรงตามหน้า Extra';
        const pillCls = isOk ? 'status-pill ok' : 'status-pill warn';
        const locHtml = r.qid
          ? `<button type="button" data-qid="${esc(r.qid)}" class="jump-btn">${esc(r.loc)}</button>`
          : `<span style="color:var(--muted);">${esc(r.loc)}</span>`;
        return `
          <tr>
            <td style="font-weight:700; white-space:nowrap;">หน้า ${r.kp}</td>
            <td>
              <div style="font-weight:600;">${esc(r.tp)}</div>
              <div class="syn-sub">${esc(r.syn.join(' / '))}</div>
            </td>
            <td style="color:var(--muted);">${esc(r.cr)}</td>
            <td>${locHtml}</td>
            <td><span class="${pillCls}">${esc(r.st)}</span></td>
          </tr>
        `;
      }).join('');

      elExtra.innerHTML = `
        ${summaryHtml}
        <div class="table-card">
          <div class="table-head">
            <h2>รายการที่ระบุตำแหน่งคลาดเคลื่อน / ไม่ครบ / ไม่อยู่ในตัวเลือก (${nonExact.length} รายการ)</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Extra</th>
                  <th>คำ/วลีหลัก</th>
                  <th>ที่ระบุบนหน้า Extra</th>
                  <th>ตำแหน่งจริง / หมายเหตุ</th>
                  <th>สถานะ</th>
                </tr>
              </thead>
              <tbody>${notesRows}</tbody>
            </table>
          </div>
        </div>

        <div class="table-card">
          <div class="table-head">
            <h2>ตารางจับคู่ Extra ครบทุกหน้า (หน้า 1–89 · 91 รายการ)</h2>
            <p>คลิกที่ตำแหน่งจริงในแบบฝึกเพื่อกระโดดไปยังข้อนั้นทันที</p>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Extra</th>
                  <th>คำ/วลีหลัก และข้อมูล Extra</th>
                  <th>ที่ระบุบนหน้า Extra</th>
                  <th>ตำแหน่งจริงในแบบฝึก</th>
                  <th>สถานะ</th>
                </tr>
              </thead>
              <tbody>${allRows}</tbody>
            </table>
          </div>
        </div>
      `;

      elExtra.querySelectorAll('button[data-qid]').forEach((btn) => {
        btn.addEventListener('click', () => jumpToQuestion(btn.getAttribute('data-qid')));
      });
    }

    btnTabEx.addEventListener('click', () => setTab('exercises'));
    btnTabExtra.addEventListener('click', () => setTab('extra'));
    elSearch.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderExercises();
    });
    elToggleAns.addEventListener('change', (e) => {
      showAnswers = e.target.checked;
      renderExercises();
    });
    elToggleOnlyExtra.addEventListener('change', (e) => {
      onlyExtra = e.target.checked;
      renderExercises();
    });

    renderFilterPills();
    renderExercises();
    renderExtraView();
  </script>
</body>
</html>
